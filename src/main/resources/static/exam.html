<!DOCTYPE html>
<html>
<head>
    <title>Java Online Exam</title>
</head>
<body>

    <h1>Java Online Exam</h1>

    <div id="questions"></div>

    <button onclick="submitAnswers()">Submit Exam</button>

    <script>
        let questions = [];

        fetch("/questions/paper/2")
            .then(response => response.json())
            .then(data => {

                questions = data;

                const container = document.getElementById("questions");

                data.forEach((question, index) => {

                    const div = document.createElement("div");

                    div.innerHTML = `
                        <h3>${index + 1}. ${question.questionText}</h3>
                    `;

                    question.options.forEach(option => {

                        const label = document.createElement("label");

                        label.innerHTML = `
                            <input type="radio"
                                   name="question${question.questionId}"
                                   value="${option.id}">
                            ${option.optionText}
                            <br>
                        `;

                        div.appendChild(label);
                    });

                    container.appendChild(div);
                });
            })
            .catch(error => {
                console.error("Error loading questions:", error);
            });

        function submitAnswers() {

            questions.forEach(question => {

                const selected = document.querySelector(
                    `input[name="question${question.questionId}"]:checked`
                );

                if (selected) {
                    console.log(
                        "Question ID:",
                        question.questionId,
                        "Selected Option ID:",
                        selected.value
                    );
                }
            });

            alert("Answers selected successfully!");
        }
    </script>

</body>
</html>
